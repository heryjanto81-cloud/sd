plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wilzgamez.wnisimulator'
    compileSdk 34

    defaultConfig {
        applicationId "com.wilzgamez.wnisimulator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "WNI-Simulator-GetRich.apk"
        }
    }
}
